name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Nine shipped circuits: the eight-circuit frontier set plus the superseded
      # 92 @ depth 4, kept beside the 91 that supersedes it (records convention).
      # NOTE: two of them sit at the same (gates, depth) point --
      # the from-scratch 88 @ depth 5 and the derived one -- so every check here
      # is keyed on the FILE, never on the (gates, depth) pair.
      - name: Verify the record circuits with the standalone oracle
        run: |
          python verify_circuit.py evidence/circuits/mixcolumns_97gates_depth3.json 3
          python verify_circuit.py evidence/circuits/mixcolumns_91gates_depth4.json 4
          python verify_circuit.py evidence/circuits/mixcolumns_92gates_depth4.json 4
          python verify_circuit.py evidence/circuits/mixcolumns_89gates_depth5.json 5
          python verify_circuit.py evidence/circuits/mixcolumns_88gates_depth5_fromscratch.json 5
          python verify_circuit.py evidence/circuits/mixcolumns_88gates_depth5.json 5
          python verify_circuit.py evidence/circuits/mixcolumns_88gates_depth6.json 6
          python verify_circuit.py evidence/circuits/mixcolumns_88gates_depth7.json 7
          python verify_circuit.py evidence/circuits/mixcolumns_88gates_depth8_thirdfamily.json 8
      - name: Every stated depth is tight - each record must FAIL at depth-1
        run: |
          set -e
          fail_at() {
            if python verify_circuit.py "$1" "$2" > /dev/null; then
              echo "ERROR: $1 unexpectedly verified at depth $2"; exit 1
            fi
            echo "ok: $1 correctly rejected at depth $2"
          }
          fail_at evidence/circuits/mixcolumns_97gates_depth3.json 2
          fail_at evidence/circuits/mixcolumns_91gates_depth4.json 3
          fail_at evidence/circuits/mixcolumns_92gates_depth4.json 3
          fail_at evidence/circuits/mixcolumns_89gates_depth5.json 4
          fail_at evidence/circuits/mixcolumns_88gates_depth5_fromscratch.json 4
          fail_at evidence/circuits/mixcolumns_88gates_depth5.json 4
          fail_at evidence/circuits/mixcolumns_88gates_depth6.json 5
          fail_at evidence/circuits/mixcolumns_88gates_depth7.json 6
          fail_at evidence/circuits/mixcolumns_88gates_depth8_thirdfamily.json 7
      - name: Unit tests (core invariants)
        run: python -m unittest discover -s tests -v
      # REPRODUCE.md tier A, the parts that need nothing but the standard
      # library. Each command's expected output is quoted in REPRODUCE.md.
      # The depth-3 pack is named depth3_gte81 but what CI checks -- and what
      # a certificate can prove from a file -- is >= 80.  The step to >= 81 is
      # a HiGHS dual bound from a 16.8 h run that hit its time limit at a
      # 66.89 % gap: sound, documented in REPRODUCE.md C4, NOT re-checkable
      # here.  README, bounds/README.md and bounds/depth3_gte81/STATEMENT.md
      # all state the two parts separately.  Do not merge them.
      - name: Lower-bound certificates (>= 56; >= 80 certified at depth 3; >= 92 cancellation-free)
        run: |
          set -e
          cd bounds
          python3 gte56/check_gte56.py
          python3 depth3_gte81/certify.py --check depth3_gte81/cert_depth3.json
          python3 depth3_gte81/control_primal.py
          python3 depth3_gte81/control_cuts.py
          python3 depth3_gte81/control_lp.py
          python3 cf_gte92/check_cf_cert.py --aes-crosscheck
          python3 cf_gte92/check_cf_cert.py --cert cf_gte92/cert_cf92_sharper.json
          python3 cf_gte92/check_cancellation_free.py cf_gte92/cf_102gates_depth5.json --require-cancellation-free
      - name: The tripwire must stay silent on the records and fire on a planted defect
        run: |
          set -e
          cd corpus/tripwire_demo
          python3 ../../tools/tripwire.py --selftest circuits/mixcolumns_88gates_depth5_fromscratch.json
          python3 ../../tools/tripwire.py --quiet circuits/mixcolumns_88gates_depth*.json \
                  circuits/foreign_88gates_depth7_eprint_2026-1481.json
      - name: Corpus sample, vocabulary counterexample, and the deletion certificate
        run: |
          set -e
          (cd corpus/sample && python3 tools/check_sample.py)
          (cd corpus/vocabulary && python3 tools/verify_circuit.py S89_out_of_vocabulary_89gates.json)
          (cd corpus/vocabulary && python3 tools/oov_check.py vocab.json S89_out_of_vocabulary_89gates.json)
          (cd corpus/calibration && python3 verify_circuit.py cleanroom_93gates.json)
          cd corpus/deletion_certificate
          gcc -O2 -Wall -o tools/delcert tools/delcert.c
          tools/delcert --bin fixtures/ctrl_pos89.bin --targets targets.txt --k 89 --tag ctrlpos89 --every 0 | grep '"realisable":498'
          tools/delcert --bin fixtures/ctrl_neg498.bin --targets targets.txt --k 88 --tag ctrl498 --every 0 | grep '"realisable":0,'
          tools/delcert --bin ../sample/corpus88_sample.bin --targets targets.txt --k 88 --tag sample --every 0 | grep '"realisable":0,'
          python3 tools/aggregate.py
      - name: The independence statistic (61 of 88 shared with the prior-art 88)
        run: |
          python3 scripts/overlap.py \
            evidence/circuits/mixcolumns_88gates_depth7.json \
            evidence/campaign87_imported_prior_art/jean_88gates_depth7_eprint_2026-1481.json | grep 'shared      61'
      # BL-3 / S1: the pack's own advertised integrity check must pass in a
      # clean checkout.  It drifted once because prose files were edited after
      # code/make_checksums.sh last ran; running it here stops that recurring.
      - name: Shipped manifests verify
        run: |
          set -e
          (cd encodings && sha256sum -c SHA256SUMS)
          (cd corpus/sample && sha256sum -c SAMPLE.sha256)
          (cd bounds && sha256sum -c matrix.sha256)
      # No tracked file may carry an absolute path from the machine that
      # produced it.  164 evidence files did; they were normalized 2026-09-03.
      - name: No absolute local paths in tracked files
        run: |
          if git grep -nI '/home/' -- . ; then
            echo "ERROR: a tracked file carries an absolute /home/ path"; exit 1
          fi
          echo "ok: no absolute /home/ paths in tracked files"
      - name: Compile check
        run: python -m compileall -q reproduce pipeline verify_circuit.py

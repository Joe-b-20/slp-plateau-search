<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 390" font-family="Helvetica,Arial,sans-serif" font-size="13" role="img" aria-labelledby="ftitle fdesc">
<title id="ftitle">AES MixColumns: the published depth-count Pareto frontier versus this work</title>
<desc id="fdesc">Scatter plot, 2-input XOR gate count against circuit depth. The published frontier (dashed grey) runs 99 gates at depth 3 (Shi-Feng-Xu 2023), 97 at depth 4 and 94 at depth 5 (Osvik-Canright 2024), 92 at depth 6 (Maximov) and 88 at depth 7 (Jean, ePrint 2026/1481). This work (solid blue) runs 97 at depth 3, 92 at depth 4, 89 at depth 5 and 88 at depth 7; the depth-7 point is drawn as a half-grey half-blue marker because our 88 ties the published 88 with an independent circuit (61 of 88 masks shared), rather than beating it. A hollow blue marker shows our 88 at depth 8, a third distinct family that is dominated by our own 88 at depth 7. A hollow grey marker shows the published Sun-Yang-Li 89 (ePrint 2025/1493), off the frontier; that paper states no depth, so it is placed at depth 9, this repository's own measurement of its transcription. Crosses mark this project's own superseded earlier results.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1354 210" font-family="Helvetica,Arial,sans-serif" font-size="14" role="img" aria-labelledby="ltitle ldesc">
<title id="ltitle">Lineage of the 88-gate depth-7 AES MixColumns circuit</title>
<desc id="ldesc">A left-to-right chain of boxes, each a verified circuit labelled gates-at-depth. From scratch to 97 at depth 3, then down the 2026-07-13 parallel ladder (96, 95, 94, 93, 92, 92) to 89 at depth 6, then 89 at depth 5 in the 2026-07-14 sub-89 run by a single reroute. From there an uphill step to an exactly rho-squared-symmetric 94 at depth 5 (five gates worse than the record, 82 of 94 masks shared with the 89), used as the seed from which the merged-engine worker w10_sym94 found the 88-gate depth-7 circuit on 2026-07-26. The 97, the 89 at depth 5 and the 88 are highlighted as records.</desc>

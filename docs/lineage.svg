<text x="20" y="144" fill="#666666" font-size="11.5">gates@depth per node; every arrow is a seeded search step with a timestamped log line and a verified circuit in evidence/.</text>
<text x="20" y="161" fill="#666666" font-size="11.5">Root 97@3 from scratch (anneal3, 2026-07-13, t = 235 s); 89@6 at t = 39 725 s of the 21 h ladder; 89@5 by one reroute (t = 592 s).</text>
<text x="20" y="178" fill="#666666" font-size="11.5">The +5-gate exactly &#961;&#178;-symmetric 94@5 shares 82/94 masks with the 89@5; the 88@7 came from merged-engine worker w10_sym94 at t = 1 973 s (2026-07-26 22:08:19).</text>
<text x="20" y="195" fill="#666666" font-size="11.5">The 88@7 ties the published 88@7 (Jean, ePrint 2026/1481) with an independent circuit - 61/88 shared masks. The 88@8 third family is not shown: its seed chain passes through Jean's published 88.</text>

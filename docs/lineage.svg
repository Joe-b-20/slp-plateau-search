<text x="20" y="258" fill="#666666" font-size="11.5">gates@depth per node; every arrow is a search step with a timestamped log line and a verified circuit in evidence/.</text>
<text x="20" y="275" fill="#666666" font-size="11.5">Top chain: root 97@3 from scratch (anneal3, 2026-07-13, t = 235 s); 89@6 at t = 39 725 s of the 21 h ladder; 89@5 by one reroute (t = 592 s).</text>
<text x="20" y="292" fill="#666666" font-size="11.5">The +5-gate exactly &#961;&#178;-symmetric 94@5 shares 82/94 masks with the 89@5; the 88@7 came from worker w10_sym94 at t = 1 973 s (2026-07-26 22:08:19).</text>
<text x="20" y="309" fill="#666666" font-size="11.5">Bottom chain: no seed circuit at all - randomized balanced XOR trees over the 32 raw inputs (139 gates at depth 3), reduced to 88 gates in 37 min,</text>
<text x="20" y="326" fill="#666666" font-size="11.5">the depth-6 tie-break landing 0.5 s after the depth-7 one (2026-07-28 17:19:45). A fourth 88-gate family, at Jaccard 0.313-0.323 to every other known 88.</text>
<text x="20" y="343" fill="#666666" font-size="11.5">The 88@7 ties the published 88@7 (Jean, ePrint 2026/1481) with an independent circuit - 61/88 shared masks; 88 is Jean's count and Jean has priority.</text>
<text x="20" y="360" fill="#666666" font-size="11.5">Not shown: the seed chains of the 88@8 and the 88@5 both pass through Jean's published 88 - see evidence/RESULTS.md sections 5 and 7.</text>

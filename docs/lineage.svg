<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1354 380" font-family="Helvetica,Arial,sans-serif" font-size="14" role="img" aria-labelledby="ltitle ldesc">
<title id="ltitle">The two own-lineage chains: to the 88-gate depth-7 circuit, and to the 88-gate depth-6 circuit found from scratch</title>
<desc id="ldesc">Two left-to-right chains of boxes, each box a verified circuit labelled gates-at-depth. The top chain runs from scratch to 97 at depth 3, then down the 2026-07-13 parallel ladder (96, 95, 94, 93, 92, 92) to 89 at depth 6, then 89 at depth 5 in the 2026-07-14 sub-89 run by a single reroute, then an uphill step to an exactly rho-squared-symmetric 94 at depth 5 (five gates worse than the record, 82 of 94 masks shared with the 89), used as the seed from which the merged-engine worker w10_sym94 found the 88-gate depth-7 circuit on 2026-07-26. The bottom chain is independent of the top one and of all published work: on 2026-07-28 a from-scratch worker of the 87-hunt fleet built a randomized 139-gate depth-3 circuit as its root and reduced it through 95, 92, 90 and 89 to 88 gates at depth 7 and then, half a second later, depth 6. The 97, the 89 at depth 5, the 88 at depth 7 and the 88 at depth 6 are highlighted as records.</desc>
